[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Fast unit tests.
    integration: Integration tests that may take longer.
    smoke: End-to-end smoke tests.
    gpu: Tests that require GPU-enabled libraries or hardware.
    requires_xtb: Requires xtb binary in PATH.
    requires_quickvina2: Requires QuickVina2 binary in PATH.
    requires_molscore: Requires molscore package.
